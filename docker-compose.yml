services:
  guardrails-api:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - '8000:8000'

    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}

    extra_hosts:
      - 'host.docker.internal:host-gateway'

    init: true
    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL
